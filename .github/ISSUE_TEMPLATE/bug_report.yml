name: Bug report
description: Something in vinyasa doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `vinyasa --version`, `varna --version` and `varna doctor`, your GTK version and distribution.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output and log
      description: What you clicked or pressed, and the output of running `vinyasa` from a terminal.
      render: text
